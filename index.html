    :root {
      color-scheme: light;
      --blue: #013eab;
      --ink: #17294c;
      --line: #c8d8fb;
      font: 17px/1.55 system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: #ecf2ff; color: var(--ink); }
    main { max-width: 860px; margin: auto; padding: 16px; }
    header, .panel {
      border-radius: 20px;
      padding: clamp(16px, 4vw, 30px);
      margin-bottom: 18px;
    }
    header {
      display: flex; align-items: center; gap: 20px;
      background: #fff4c7; color: var(--blue);
    }
    header img { width: clamp(57px, 12vw, 96px); height: auto; }
    header h1 { margin: 0; font-size: clamp(1.35rem, 4vw, 2.15rem); }
    header p { margin: 2px 0 0; }
    .panel { background: white; }
    h2, h3 { color: var(--blue); margin-top: 0; }
    p { margin: 0 0 1rem; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .test {
      display: block; padding: 12px; margin: 8px 0; color: var(--blue);
      border-radius: 10px; text-decoration: none; font-weight: 650;
    }
    .a1 { background: #ecffe9; }
    .a2 { background: #dbfff5; }
    .b1 { background: #eeeaff; }
    button, input { font: inherit; }
    input[type=text] {
      width: 100%; padding: 10px; border: 1px solid var(--line);
      color: var(--ink); border-radius: 8px; min-height: 46px;
    }
    button {
      cursor: pointer; border: 0; border-radius: 10px;
      min-height: 46px; padding: 10px 16px; font-weight: 700;
      background: var(--blue); color: white;
    }
    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 3px solid #ffab02; outline-offset: 3px;
    }
    .toolbar {
      display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
      margin-top: 18px;
    }
    .read {
      white-space: pre-line; padding: 16px; background: #fff4c7;
      border-radius: 12px;
    }
    fieldset {
      border: 1px solid var(--line); border-radius: 12px;
      padding: 12px; margin: 0 0 15px; min-width: 0;
    }
    legend { padding: 0 6px; font-weight: 700; }
    .choice {
      display: flex; gap: 10px; align-items: center; min-height: 46px;
      cursor: pointer; padding: 6px 9px; margin: 4px 0;
      border-radius: 8px; background: #f1f5ff;
    }
    .choice:has(input:checked) { background: #dbfff5; }
    .choice input { accent-color: var(--blue); width: 18px; height: 18px; flex-shrink: 0; }
    .score { font-size: 2.5rem; color: var(--blue); font-weight: 800; }
    .result { background: #ecffe9; }
    .notice { color: #8a4500; }
    @media (max-width: 560px) {
      .grid { grid-template-columns: 1fr; }
      header { gap: 12px; }
    }
  </style>
</head>

const app = document.getElementById("app");
document.getElementById("logo").addEventListener("error", event => {
  event.currentTarget.hidden = true;
});
const languages = { fr: "Français", en: "Anglais" };
const levels = ["A1", "A2", "B1"];
const params = new URLSearchParams(location.search);
const language = params.get("langue");
const number = Number(params.get("test"));
const validTest = Object.hasOwn(tests, language)
  && Number.isInteger(number) && number >= 1 && number <= 12;

function node(tag, text, className) {
  const element = document.createElement(tag);
  if (text !== undefined) element.textContent = text;
  if (className) element.className = className;
  return element;
}

function testLink(lang, index) {
  const url = new URL(location.href);
  url.search = new URLSearchParams({ langue: lang, test: String(index) }).toString();
  url.hash = "";
  return url.href;
}

function homeLink() {
  const url = new URL(location.href);
  url.search = "";
  url.hash = "";
  return url.href;
}

function shuffle(items) {
  const copy = [...items];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

function showCatalogue() {
  const panel = node("section", undefined, "panel");
  panel.append(node("h2", "Choisir un test"));
  if (params.has("test") || params.has("langue")) {
    panel.append(node("p", "Ce lien de test est incomplet ou invalide.", "notice"));
  }
  const grid = node("div", undefined, "grid");
  for (const [lang, name] of Object.entries(languages)) {
    const col = node("section");
    col.append(node("h3", name));
    tests[lang].forEach(([title], i) => {
      const level = levels[Math.floor(i / 4)];
      const link = node("a", `${level} · Test ${i + 1} · ${title}`, `test ${level.toLowerCase()}`);
      link.href = testLink(lang, i + 1);
      col.append(link);
    });
    grid.append(col);
  }
  panel.append(grid);
  app.replaceChildren(panel);
}

function showStart() {
  const [title] = tests[language][number - 1];
  const level = levels[Math.floor((number - 1) / 4)];
  document.title = `${languages[language]} · Test ${number} ${level} · El Yasmine Online`;
  const panel = node("section", undefined, "panel");
  const form = node("form");
  const labels = node("div", undefined, "grid");

  for (const [name, labelText, autocomplete] of [
    ["prenom", "Prénom", "given-name"],
    ["nom", "Nom", "family-name"]
  ]) {
    const label = node("label", labelText);
    const input = node("input");
    input.type = "text";
    input.name = name;
    input.required = true;
    input.maxLength = 60;
    input.autocomplete = autocomplete;
    input.addEventListener("input", () => input.setCustomValidity(""));
    label.append(input);
    labels.append(label);
  }

  const bar = node("div", undefined, "toolbar");
  const start = node("button", "Commencer le test");
  start.type = "submit";
  const share = node("button", "Copier le lien de ce test");
  share.type = "button";
  const status = node("span");
  status.setAttribute("role", "status");
  share.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(testLink(language, number));
      status.textContent = "Lien copié.";
    } catch {
      status.textContent = "Tu peux copier l’adresse dans la barre du navigateur.";
    }
  });

  bar.append(start, share, status);
  form.append(labels, bar);
  form.addEventListener("submit", event => {
    event.preventDefault();
    const firstName = form.elements.prenom.value.trim();
    const lastName = form.elements.nom.value.trim();
    if (!firstName || !lastName) {
      const empty = !firstName ? form.elements.prenom : form.elements.nom;
      empty.setCustomValidity("Renseigne ce champ pour commencer.");
      empty.reportValidity();
      return;
    }
    showQuestions(firstName, lastName);
  });

  panel.append(
    node("h2", `${languages[language]} · Test ${number} · ${level}`),
    node("h3", title),
    node("p", "10 questions · Environ 20 minutes · Note sur 20"),
    form
  );
  app.replaceChildren(panel);
}

function showQuestions(firstName, lastName) {
  const index = number - 1;
  const level = levels[Math.floor(index / 4)];
  const [title, passage, reading] = tests[language][index];
  const start = (index % 4) * 5;
  const languageQuestions = bank[language][level].slice(start, start + 5);
  const questions = [...reading, ...languageQuestions];
  const isEnglish = language === "en";
  const panel = node("section", undefined, "panel");
  const heading = node("h2", title);
  heading.lang = language;
  heading.tabIndex = -1;
  const form = node("form");
  const instructions = node("p");
  instructions.setAttribute("role", "status");

  const readingPart = node("section");
  const languagePart = node("section");
  readingPart.lang = language;
  languagePart.lang = language;
  readingPart.append(
    node("h3", isEnglish ? "Read the text" : "Lis le texte"),
    node("p", passage, "read")
  );
  languagePart.append(node("h3", isEnglish ? "Language questions" : "Questions de langue"));

  questions.forEach(([prompt, answer, distractor1, distractor2], i) => {
    const group = node("fieldset");
    group.append(node("legend", `${i + 1}. ${prompt}`));
    const options = shuffle([answer, distractor1, distractor2]);
    options.forEach(option => {
      const label = node("label", undefined, "choice");
      const input = node("input");
      input.type = "radio";
      input.name = `q${i}`;
      input.value = option;
      input.required = true;
      label.append(input, document.createTextNode(option));
      group.append(label);
    });
    (i < reading.length ? readingPart : languagePart).append(group);
  });

  const submit = node("button", "Terminer et voir ma note");
  submit.type = "submit";
  form.append(readingPart, languagePart, submit);
  let submitted = false;

  function finish() {
    if (submitted) return;
    submitted = true;
    clearInterval(timer);
    const answers = new FormData(form);
    const correct = questions.reduce(
      (total, question, i) => total + Number(answers.get(`q${i}`) === question[1]),
      0
    );
    showResult(firstName, lastName, title, correct);
  }

  form.addEventListener("submit", event => {
    event.preventDefault();
    finish();
  });

  const deadline = Date.now() + 20 * 60 * 1000;
  const clock = node("p", "Temps restant · 20:00");
  function updateClock() {
    const seconds = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    const minutes = Math.floor(seconds / 60);
    clock.textContent = `Temps restant · ${String(minutes).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;

    if (seconds === 60) instructions.textContent = "Il reste une minute.";
    if (seconds === 0) finish();
  }
  const timer = setInterval(updateClock, 250);
  panel.append(
    heading,
    clock,
    instructions,
    node("p", "Choisis une réponse par question. À la fin du temps, les réponses déjà cochées sont corrigées."),
    form
  );
  app.replaceChildren(panel);
  heading.focus();
  window.scrollTo(0, 0);
}

function showResult(firstName, lastName, title, correct) {
  const panel = node("section", undefined, "panel result");
  const heading = node("h2", "Ton résultat");
  heading.tabIndex = -1;
  const titleLine = node("p", `${languages[language]} · Test ${number} · ${title}`);
  const text = node("p", `Bravo, ${firstName} ${lastName}, tu as terminé le test !`);
  const score = node("p", `${correct * 2} / 20`, "score");
  const details = node("p", `${correct} bonne${correct === 1 ? "" : "s"} réponse${correct === 1 ? "" : "s"} sur 10.`);
  panel.append(heading, titleLine, text, score, details);
  app.replaceChildren(panel);
  heading.focus();
  window.scrollTo(0, 0);
}

if (validTest) showStart();
else showCatalogue();
</script>
